{% extends 'base.html' %}

{% block title %} Блог такой-то | Skystore{% endblock %} <!-- Динамичный title(меняется от товара) -->
{% block page_header %}{% endblock %}

{% block content%}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="card-text"> Дейстивельно хотите удалить {{post.title}}</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <button type="submit" class="btn btn-danger mb-4">
                        Удалить
                    </button>
                    <a class="btn btn-primary" href="{% url 'blog:blog_list' %}" role="button">Отменить</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

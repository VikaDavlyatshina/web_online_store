
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Skystore{% endblock %}</title>
    <!-- Подключение Bootstrap -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link href="/static/css/catalog.css" rel="stylesheet">
</head>
<body>
{% include 'includes/inc_menu.html' %}
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Skystore</h1>
        <p class="lead">Skystore - наш маленький интернет-магазин. Здесь вы можете купить разные товары по выгодным ценам!</p>
    </div>

    {% block content %}{% endblock %}
    <svg style="display: none;">
        <symbol id="image-icon" viewBox="0 0 24 24">
            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
        </symbol>
    </svg>

    <!-- Подключение Bootstrap JS -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
<script>
    // 1. Ждем, пока страница загрузится
  document.addEventListener('DOMContentLoaded', function() {

    // 2. Ищем все элементы с подсказками
    var tooltipElements = document.querySelectorAll('[data-bs-toggle="tooltip"]');

    // 3. Проверяем: если таких элементов нет - выходим
    if (tooltipElements.length === 0) return;

    // 4. Для каждого найденного элемента
    tooltipElements.forEach(function(element) {
        // 5. Создаем подсказку Bootstrap
        new bootstrap.Tooltip(element);
    });

});
</script>
</body>
</html>

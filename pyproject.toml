[project]
name = "web-online-store"
version = "0.1.0"
description = "Django online store"
authors = [
    {name = "Davlystshina Victoria", email = "vika.davlyatshina@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "django>=6.0,<7.0",
    "psycopg>=3.1.0",
    "python-dotenv>=1.2.1,<2.0",
    "pillow>=12.0.0,<13.0",
    "ipython>=9.8.0,<10.0"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
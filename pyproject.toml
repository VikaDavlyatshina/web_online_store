[project]
name = "web-online-store"
version = "0.1.0"
description = "Django online store"
authors = [
    {name = "Davlystshina Victoria", email = "vika.davlyatshina@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "django>=6.0,<7.0",
    "psycopg>=3.1.0",
    "python-dotenv>=1.2.1,<2.0",
    "pillow>=12.0.0,<13.0",
    "ipython>=9.8.0,<10.0",
    "django-phonenumber-field (>=8.4.0,<9.0.0)",
    "phonenumbers (>=9.0.23,<10.0.0)",
    "redis (>=7.2.0,<8.0.0)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false


[dependency-groups]
dev = [
    "isort (>=7.0.0,<8.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119